<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرحباً رمضان | Ramadan Mubarak</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', 'Amiri', sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* نجوم متحركة في الخلفية */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* هلال القمر المتحرك */
        .crescent-container {
            position: absolute;
            top: 10%;
            left: 10%;
            z-index: 2;
            animation: float 6s ease-in-out infinite;
        }

        .crescent {
            width: 120px;
            height: 120px;
            background: transparent;
            border-radius: 50%;
            box-shadow: -20px 0 0 0 #ffd700;
            transform: rotate(-30deg);
            position: relative;
        }

        .crescent::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 30%, #fffacd, transparent);
            border-radius: 50%;
            opacity: 0.6;
            animation: glow 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-30deg); }
            50% { transform: translateY(-20px) rotate(-30deg); }
        }

        @keyframes glow {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }

        /* فانوس رمضان */
        .lantern-container {
            position: absolute;
            top: 15%;
            right: 15%;
            z-index: 2;
            animation: swing 4s ease-in-out infinite;
        }

        .lantern {
            width: 80px;
            height: 100px;
            background: linear-gradient(180deg, #ff6b35 0%, #f7931e 50%, #ff6b35 100%);
            border-radius: 40px 40px 10px 10px;
            position: relative;
            box-shadow: 0 0 30px rgba(255, 107, 53, 0.6);
        }

        .lantern::before {
            content: '';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 15px;
            background: #8b4513;
            border-radius: 3px;
        }

        .lantern::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 10px;
            background: #8b4513;
            border-radius: 0 0 5px 5px;
        }

        .lantern-inner {
            position: absolute;
            top: 20%;
            left: 20%;
            right: 20%;
            bottom: 20%;
            background: radial-gradient(ellipse at center, #ffeb3b 0%, #ff9800 100%);
            border-radius: 50%;
            opacity: 0.9;
            animation: flicker 1.5s ease-in-out infinite;
        }

        @keyframes swing {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }

        @keyframes flicker {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        /* تمرة متحركة */
        .dates-container {
            position: absolute;
            bottom: 20%;
            left: 15%;
            z-index: 2;
            animation: bounce 3s ease-in-out infinite;
        }

        .date-fruit {
            width: 60px;
            height: 80px;
            background: linear-gradient(180deg, #5d4037 0%, #3e2723 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .date-fruit::before {
            content: '';
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 15px;
            height: 10px;
            background: #4a2c2a;
            border-radius: 50%;
        }

        .date-fruit::after {
            content: '';
            position: absolute;
            top: 20%;
            left: 20%;
            right: 20%;
            height: 40%;
            background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, transparent 100%);
            border-radius: 50%;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* مسجد */
        .mosque-container {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            opacity: 0.3;
        }

        .mosque {
            width: 300px;
            height: 150px;
            background: linear-gradient(180deg, #1a237e 0%, #0d1642 100%);
            clip-path: polygon(20% 100%, 20% 60%, 35% 60%, 35% 40%, 30% 30%, 40% 20%, 50% 30%, 50% 60%, 65% 60%, 65% 40%, 60% 30%, 70% 20%, 80% 30%, 80% 60%, 80% 100%);
        }

        /* المحتوى الرئيسي */
        .main-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .welcome-text {
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(45deg, #ffd700, #ffed4e, #fff, #ffd700);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shine 3s linear infinite;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            letter-spacing: 2px;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .sub-text {
            font-size: 2rem;
            color: #fff;
            margin-bottom: 30px;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
            animation: fadeInUp 2s ease-out;
        }

        .blessing-text {
            font-size: 1.5rem;
            color: #ffd700;
            max-width: 600px;
            line-height: 1.8;
            margin-bottom: 40px;
            animation: fadeInUp 2s ease-out 0.5s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* أزرار التحكم بالصوت */
        .audio-controls {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            animation: fadeInUp 2s ease-out 1s both;
        }

        .btn {
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 700;
        }

        .btn-play {
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            color: #1a1a2e;
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.4);
        }

        .btn-play:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(255, 215, 0, 0.6);
        }

        .btn-pause {
            background: linear-gradient(45deg, #e74c3c, #c0392b);
            color: white;
            box-shadow: 0 5px 20px rgba(231, 76, 60, 0.4);
        }

        .btn-pause:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(231, 76, 60, 0.6);
        }

        /* جزيئات متحركة */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #ffd700;
            border-radius: 50%;
            animation: rise 10s linear infinite;
            opacity: 0.6;
        }

        @keyframes rise {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-100px) scale(1);
                opacity: 0;
            }
        }

        /* إيموشن رمضانية */
        .emoji-container {
            position: fixed;
            font-size: 2rem;
            z-index: 3;
            animation: floatEmoji 8s ease-in-out infinite;
            opacity: 0.7;
        }

        @keyframes floatEmoji {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(10px, -20px) rotate(10deg); }
            50% { transform: translate(-10px, -10px) rotate(-5deg); }
            75% { transform: translate(5px, -30px) rotate(5deg); }
        }

        /* تأثيرات إضافية */
        .glow-effect {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(255, 215, 0, 0.1) 0%, transparent 70%);
            pointer-events: none;
            z-index: 1;
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); }
        }

        /* تصميم متجاوب */
        @media (max-width: 768px) {
            .welcome-text {
                font-size: 2.5rem;
            }
            .sub-text {
                font-size: 1.5rem;
            }
            .blessing-text {
                font-size: 1.2rem;
            }
            .crescent {
                width: 80px;
                height: 80px;
                box-shadow: -15px 0 0 0 #ffd700;
            }
            .lantern {
                width: 60px;
                height: 80px;
            }
            .date-fruit {
                width: 50px;
                height: 70px;
            }
        }
    </style>

<body>
    <!-- نجوم الخلفية -->
    <div class="stars" id="stars"></div>

    <!-- تأثير التوهج -->
    <div class="glow-effect"></div>

    <!-- هلال القمر -->
    <div class="crescent-container">
        <div class="crescent"></div>
    </div>

    <!-- فانوس رمضان -->
    <div class="lantern-container">
        <div class="lantern">
            <div class="lantern-inner"></div>
        </div>
    </div>

    <!-- تمرة -->
    <div class="dates-container">

    </div>

    <!-- مسجد -->
    <div class="mosque-container">

    <!-- جزيئات متحركة -->
    <div class="particles" id="particles"></div>

    <!-- المحتوى الرئيسي -->

            🌙 أهلاً وسهلاً بشهر الخير والبركة 🌙<br>
            تقبل الله منا ومنكم صالح الأعمال<br>
            وجعله شهراً مليئاً بالسعادة والرحمة
        </p>

    <script>
        // إنشاء النجوم
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.width = Math.random() * 3 + 'px';
                star.style.height = star.style.width;
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 2 + 's';
                starsContainer.appendChild(star);
            }
        }

        // إنشاء الجزيئات
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 10 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // إيموشن رمضانية
        const emojis = ['🌙', '⭐', '🕌', '🕋', '📿', '🤲', '✨', '🌟', '🎆', '🕯️'];
        function createEmojis() {
            for (let i = 0; i < 15; i++) {
                const emoji = document.createElement('div');
                emoji.className = 'emoji-container';
                emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                emoji.style.left = Math.random() * 100 + '%';
                emoji.style.top = Math.random() * 100 + '%';
                emoji.style.animationDelay = Math.random() * 5 + 's';
                emoji.style.animationDuration = (Math.random() * 5 + 5) + 's';
                document.body.appendChild(emoji);
            }
        }

        // التحكم بالصوت
        const audio = document.getElementById('ramadanAudio');

        function playAudio() {
            audio.play().catch(e => {
                console.log('Audio play failed:', e);
                alert('اضغط على الصفحة أولاً ثم اضغط تشغيل الصوت');
            });
        }

        function pauseAudio() {
            audio.pause();
        }

        // تهيئة الصفحة
        window.onload = function() {
            createStars();
            createParticles();
            createEmojis();
        };

        // إضافة تفاعل عند النقر
        document.addEventListener('click', function(e) {
            // إنشاء تأثير نقر
            const ripple = document.createElement('div');
            ripple.style.position = 'fixed';
            ripple.style.left = e.clientX + 'px';
            ripple.style.top = e.clientY + 'px';
            ripple.style.width = '20px';
            ripple.style.height = '20px';
            ripple.style.background = 'rgba(255, 215, 0, 0.6)';
            ripple.style.borderRadius = '50%';
            ripple.style.transform = 'translate(-50%, -50%)';
            ripple.style.pointerEvents = 'none';
            ripple.style.animation = 'rippleEffect 1s ease-out forwards';
            document.body.appendChild(ripple);

            setTimeout(() => ripple.remove(), 1000);
        });

        // إضافة أنيميشن للنقر
        const style = document.createElement('style');
        style.textContent = `
            @keyframes rippleEffect {
                0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
                100% { transform: translate(-50%, -50%) scale(5); opacity: 0; }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
